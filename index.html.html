<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamut NHS &middot; CSS 12 Remediation Grade Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green-950:#0E241B;
  --green-900:#12301F;
  --green-800:#1B4332;
  --green-700:#245542;
  --green-600:#2D6A4F;
  --green-500:#3F8863;
  --green-100:#E9F1EA;
  --green-50:#F3F8F3;
  --gold-600:#A9821B;
  --gold-500:#C6A22E;
  --gold-100:#F6EDCE;
  --clay-600:#B0552C;
  --clay-100:#F7E7DB;
  --teal-600:#2C6E77;
  --teal-100:#DEEEF0;
  --cream:#FAF8F1;
  --paper:#FFFFFF;
  --ink:#182620;
  --ink-soft:#4B5B53;
  --line:#DCE5DD;
  --radius:10px;
  --shadow: 0 1px 2px rgba(15,36,27,0.06), 0 6px 20px -8px rgba(15,36,27,0.18);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Inter',system-ui,sans-serif;
  background:var(--cream);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{
  font-family:'Fraunces',serif;
  font-weight:600;
  letter-spacing:-0.01em;
  color:var(--green-900);
  margin:0;
}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;}
.hidden{display:none !important;}
::selection{background:var(--gold-100);}

/* ---------- Scaffolding ---------- */
#app{min-height:100vh;}

/* ---------- LOGIN ---------- */
.login-wrap{
  min-height:100vh;
  display:flex;
}
.login-hero{
  flex:1 1 42%;
  background:linear-gradient(175deg,var(--green-950) 0%, var(--green-800) 78%);
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:48px 48px 40px;
  color:#EFF5EF;
  min-width:320px;
}
.login-hero .seal-watermark{
  position:absolute;
  right:-90px;
  bottom:-90px;
  width:420px;
  height:420px;
  opacity:0.14;
  filter:grayscale(1) brightness(1.6);
  pointer-events:none;
}
.login-hero .brand-row{
  display:flex;
  align-items:center;
  gap:16px;
  position:relative;
  z-index:1;
}
.login-hero .brand-row img{
  width:58px;height:58px;border-radius:50%;
  box-shadow:0 0 0 3px rgba(255,255,255,0.15);
}
.login-hero .brand-name{font-size:13px;letter-spacing:0.02em;line-height:1.35;color:#CFE0D3;}
.login-hero .brand-name strong{display:block;color:#fff;font-size:14.5px;font-weight:600;}
.login-hero .hero-copy{position:relative;z-index:1;max-width:440px;}
.login-hero .hero-copy .eyebrow{
  color:var(--gold-500);
  font-size:14px;
  font-weight:600;
  margin-bottom:14px;
}
.login-hero .hero-copy h1{
  color:#fff;
  font-size:40px;
  line-height:1.12;
  margin-bottom:18px;
}
.login-hero .hero-copy p{
  font-size:15.5px;
  line-height:1.65;
  color:#C9DACD;
  max-width:400px;
}
.login-hero .hero-foot{
  position:relative;z-index:1;
  font-size:13px;color:#9DB6A4;
  border-top:1px solid rgba(255,255,255,0.14);
  padding-top:18px;
}

.login-main{
  flex:1 1 58%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 24px;
  background:var(--cream);
}
.login-card{
  width:100%;
  max-width:400px;
}
.login-card .kicker{
  font-size:13px;
  font-weight:600;
  color:var(--green-600);
  margin-bottom:6px;
}
.login-card h2{font-size:26px;margin-bottom:6px;}
.login-card .sub{color:var(--ink-soft);font-size:14.5px;margin-bottom:26px;line-height:1.5;}

.role-toggle{
  display:flex;
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px;
  margin-bottom:26px;
  background:var(--paper);
}
.role-toggle button{
  flex:1;
  border:none;
  background:transparent;
  padding:9px 12px;
  border-radius:999px;
  font-size:13.5px;
  font-weight:600;
  color:var(--ink-soft);
  transition:background .18s ease, color .18s ease;
}
.role-toggle button.active{
  background:var(--green-800);
  color:#fff;
}

.field{margin-bottom:16px;}
.field label{
  display:block;
  font-size:12.5px;
  font-weight:600;
  color:var(--ink-soft);
  margin-bottom:6px;
  letter-spacing:0.01em;
}
.field input{
  width:100%;
  padding:11px 13px;
  border:1px solid var(--line);
  border-radius:8px;
  font-size:14.5px;
  background:var(--paper);
  color:var(--ink);
  outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.field input:focus{
  border-color:var(--green-600);
  box-shadow:0 0 0 3px rgba(45,106,79,0.14);
}
.field .hint{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.45;}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border:none;
  border-radius:8px;
  padding:12px 18px;
  font-size:14.5px;
  font-weight:600;
  transition:filter .15s ease, transform .05s ease;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--green-800);color:#fff;width:100%;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-gold{background:var(--gold-500);color:var(--green-950);width:100%;}
.btn-gold:hover{filter:brightness(1.05);}
.btn-ghost{background:transparent;color:var(--green-700);border:1px solid var(--line);}
.btn-ghost:hover{background:var(--green-50);}
.btn-text{background:transparent;color:var(--green-700);padding:6px 4px;font-weight:600;font-size:13.5px;}
.btn-danger{background:var(--clay-600);color:#fff;}
.btn-danger:hover{filter:brightness(1.08);}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:7px;}
.btn[disabled]{opacity:0.55;pointer-events:none;}

.alert{
  border-radius:8px;
  padding:11px 13px;
  font-size:13.5px;
  margin-bottom:16px;
  line-height:1.5;
}
.alert-error{background:var(--clay-100);color:#7A3418;border:1px solid #EAC3AB;}
.alert-ok{background:var(--green-100);color:var(--green-800);border:1px solid #C7DFC9;}
.alert-info{background:var(--teal-100);color:#1E545C;border:1px solid #BFDEE1;}

.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-soft);margin-bottom:18px;border:none;background:none;padding:0;}
.back-link:hover{color:var(--green-700);}

/* ---------- APP SHELL ---------- */
.app-shell{min-height:100vh;display:flex;flex-direction:column;}
.topbar{
  background:var(--green-900);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 28px;
  gap:20px;
  flex-wrap:wrap;
}
.topbar .brand{display:flex;align-items:center;gap:12px;}
.topbar .brand img{width:38px;height:38px;border-radius:50%;}
.topbar .brand .t1{font-size:11.5px;color:#9FC2A9;letter-spacing:0.02em;}
.topbar .brand .t2{font-family:'Fraunces',serif;font-weight:600;font-size:16.5px;color:#fff;}
.topbar .userbox{display:flex;align-items:center;gap:14px;}
.topbar .userbox .who{text-align:right;font-size:13px;line-height:1.35;}
.topbar .userbox .who .name{font-weight:600;color:#fff;}
.topbar .userbox .who .role{color:#9FC2A9;font-size:11.5px;}
.topbar .avatar{
  width:34px;height:34px;border-radius:50%;
  background:var(--gold-500);color:var(--green-950);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;
}

.tabs{
  display:flex;gap:4px;
  background:var(--green-800);
  padding:0 28px;
  overflow-x:auto;
}
.tabs button{
  border:none;background:transparent;color:#CFE0D3;
  padding:13px 16px;font-size:13.5px;font-weight:600;
  border-bottom:2.5px solid transparent;white-space:nowrap;
}
.tabs button.active{color:#fff;border-bottom-color:var(--gold-500);}
.tabs button:hover:not(.active){color:#fff;}

.main{flex:1;padding:26px 28px 60px;max-width:1280px;width:100%;margin:0 auto;}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.page-head h2{font-size:23px;}
.page-head .sub{color:var(--ink-soft);font-size:13.5px;margin-top:4px;}
.save-status{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;}
.save-status .dot{width:7px;height:7px;border-radius:50%;background:var(--green-500);}
.save-status.saving .dot{background:var(--gold-500);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}

.panel{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  margin-bottom:22px;
  overflow:hidden;
}
.panel-head{
  padding:16px 20px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:var(--green-50);
}
.panel-head h3{font-size:15.5px;}
.panel-head .desc{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.panel-body{padding:20px;}

.hps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;}
.hps-grid .hg{display:flex;flex-direction:column;gap:5px;}
.hps-grid label{font-size:10.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;}
.hps-grid input{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;text-align:center;}

.table-scroll{overflow-x:auto;}
table.grades{border-collapse:collapse;width:100%;font-size:13px;min-width:1180px;}
table.grades thead th{
  position:sticky;top:0;z-index:2;
  background:var(--green-800);color:#EAF3EC;
  font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.02em;
  padding:10px 8px;text-align:center;border-right:1px solid rgba(255,255,255,0.08);
}
table.grades thead tr.grp th{background:var(--green-900);font-size:10.5px;}
table.grades tbody td{
  padding:7px 6px;text-align:center;border-bottom:1px solid var(--line);
  border-right:1px solid var(--line);
  font-variant-numeric:tabular-nums;
}
table.grades tbody tr:nth-child(even){background:var(--green-50);}
table.grades tbody tr:hover{background:var(--gold-100);}
table.grades td.name-cell{text-align:left;font-weight:600;color:var(--green-900);min-width:190px;}
table.grades td.sub{color:var(--ink-soft);font-size:11.5px;}
table.grades input.cell-input{
  width:44px;padding:5px 4px;border:1px solid transparent;border-radius:5px;
  text-align:center;font-size:12.5px;background:transparent;font-variant-numeric:tabular-nums;
}
table.grades input.cell-input:hover{border-color:var(--line);}
table.grades input.cell-input:focus{
  border-color:var(--green-600);outline:none;background:#fff;
  box-shadow:0 0 0 2px rgba(45,106,79,0.14);
}
table.grades td.computed{color:var(--ink-soft);font-weight:600;}
table.grades td.final{font-weight:700;color:var(--green-800);font-size:13.5px;}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:0.02em;}
.badge-ip{background:var(--clay-100);color:#8A3E1E;}
.badge-sp{background:var(--teal-100);color:#1E545C;}
.badge-m{background:var(--green-100);color:var(--green-800);}
.row-actions button{background:none;border:none;color:var(--ink-soft);font-size:15px;padding:3px 5px;}
.row-actions button:hover{color:var(--clay-600);}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.search-input{
  padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;min-width:220px;background:var(--paper);
}
.search-input:focus{outline:none;border-color:var(--green-600);}

/* Student view */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px;}
.stat-card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;border-left:4px solid var(--green-700);
}
.stat-card .label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);}
.stat-card .value{font-family:'Fraunces',serif;font-size:32px;font-weight:600;color:var(--green-900);margin-top:6px;}
.stat-card .value small{font-size:15px;font-weight:500;color:var(--ink-soft);}
.stat-card.accent{border-left-color:var(--gold-500);}

.breakdown-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.breakdown-table th{text-align:left;padding:10px 12px;background:var(--green-50);color:var(--green-900);font-size:11.5px;text-transform:uppercase;letter-spacing:0.02em;border-bottom:1px solid var(--line);}
.breakdown-table td{padding:10px 12px;border-bottom:1px solid var(--line);}
.breakdown-table tr:last-child td{border-bottom:none;}
.breakdown-table td.num{text-align:right;font-variant-numeric:tabular-nums;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(14,36,27,0.5);
  display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
}
.modal{
  background:var(--paper);border-radius:12px;max-width:420px;width:100%;
  padding:26px;box-shadow:0 20px 60px rgba(0,0,0,0.25);
}
.modal h3{font-size:18px;margin-bottom:8px;}
.modal p{font-size:13.5px;color:var(--ink-soft);line-height:1.55;margin-bottom:18px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}

.accounts-list{border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.accounts-list .arow{
  display:flex;align-items:center;justify-content:space-between;padding:11px 14px;
  border-bottom:1px solid var(--line);font-size:13.5px;
}
.accounts-list .arow:last-child{border-bottom:none;}
.accounts-list .arow:nth-child(even){background:var(--green-50);}
.accounts-list .arow .an{font-weight:600;color:var(--green-900);}
.accounts-list .arow .as{font-size:11.5px;color:var(--ink-soft);}

.toast{
  position:fixed;bottom:22px;right:22px;
  background:var(--green-900);color:#fff;
  padding:12px 18px;border-radius:8px;font-size:13.5px;
  box-shadow:var(--shadow);z-index:60;
  display:flex;align-items:center;gap:10px;
  animation:toastin .2s ease;
}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.loading-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;color:var(--ink-soft);font-size:14px;
}
.spinner{
  width:28px;height:28px;border-radius:50%;
  border:3px solid var(--line);border-top-color:var(--green-700);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft);}
.empty-state .es-icon{font-size:28px;margin-bottom:10px;}

@media (max-width:860px){
  .login-hero{display:none;}
  .main{padding:20px 16px 48px;}
  .topbar{padding:12px 16px;}
  .tabs{padding:0 16px;}
}
</style>
<style>
.setup-note{font-size:12px;color:var(--ink-soft);background:var(--green-50);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:16px;line-height:1.6;}
.setup-note code{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11.5px;}
</style>
</head>
<body>
<div id="app"><div class="loading-screen"><div class="spinner"></div><div>Loading grade portal&hellip;</div></div></div>

function setConfig(cfg){ localStorage.setItem('gnhs_supabase_config', JSON.stringify(cfg)); }

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normName(name){ return (name||'').trim().replace(/\s+/g,' ').toUpperCase(); }
function sum(arr){ return (arr||[]).reduce((a,b)=>a + (Number(b)||0), 0); }
function round1(n){ return Math.round(n*10)/10; }
function round2(n){ return Math.round(n*100)/100; }
function slug(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

function computeStudent(student, hps){
  const wwTotal = sum(student.ww);
  const wwHps = sum(hps.ww_days) || 1;
  const wwPS = (wwTotal / wwHps) * 100;
  const wwWS = wwPS * 0.15;
  const ptTotal = sum(student.pt);
  const ptHps = sum(hps.pt_days) || 1;
  const ptPS = (ptTotal / ptHps) * 100;
  const ptWS = ptPS * 0.65;
  const exHps = hps.ex_hps || 1;
  const exPS = ((Number(student.ex)||0) / exHps) * 100;
  const exWS = exPS * 0.20;
  const initial = wwWS + ptWS + exWS;
  const remedial = transmute(initial);
  let status = 'IP';
  if(initial >= 90) status = 'M'; else if(initial >= 75) status = 'SP';
  return { wwTotal, wwPS, wwWS, ptTotal, ptPS, ptWS, exPS, exWS, initial, remedial, status };
}

const TRANSMUTATION = [
  [0,4.67,60],[4.68,9.34,61],[9.35,14,62],[14.01,18.67,63],[18.68,23.34,64],[23.35,28,65],
  [28.01,32.67,66],[32.68,37.33,67],[37.34,42,68],[42.01,46.66,69],[46.67,51.33,70],[51.34,56,71],
  [56.01,60.66,72],[60.67,65.33,73],[65.34,69.99,74],[70,71.17,75],[71.18,72.35,76],[72.36,73.53,77],
  [73.54,74.71,78],[74.72,75.89,79],[75.9,77.07,80],[77.08,78.25,81],[78.26,79.43,82],[79.44,80.61,83],
  [80.62,81.79,84],[81.8,82.97,85],[82.98,84.15,86],[84.16,85.33,87],[85.34,86.51,88],[86.52,87.69,89],
  [87.7,88.87,90],[88.88,90.05,91],[90.06,91.23,92],[91.24,92.41,93],[92.42,93.59,94],[93.6,94.77,95],
  [94.78,95.95,96],[95.96,97.13,97],[97.14,98.31,98],[98.32,99.49,99],[99.5,100,100]
];
function transmute(g){
  g = Math.max(0, Math.min(100, g));
  for(const [min,max,grade] of TRANSMUTATION) if(g >= min && g <= max) return grade;
  return g > 100 ? 100 : 60;
}

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = '<span>'+msg+'</span>';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  const cfg = getConfig();
  if(!cfg || !cfg.url || !cfg.anonKey){ state.route = 'setup'; render(); return; }
  supabase = createClient(cfg.url, cfg.anonKey);
  const { data: { session } } = await supabase.auth.getSession();
  state.session = session;
  if(session){
    await resolveRole();
  } else {
    state.route = 'login';
  }
  render();
}

async function resolveRole(){
  const uid = state.session.user.id;
  const { data: adminRow } = await supabase.from('app_admins').select('user_id').eq('user_id', uid).maybeSingle();
  if(adminRow){
    state.isAdmin = true;
    await loadAllSectionsAndStudents();
    state.activeSection = Object.keys(state.sections)[0] || null;
    state.route = 'admin';
    return;
  }
  const { data: stuRow } = await supabase.from('students').select('*').eq('auth_user_id', uid).maybeSingle();
  if(stuRow){
    state.isAdmin = false;
    state.myStudent = stuRow;
    const { data: sec } = await supabase.from('sections').select('*').eq('key', stuRow.section_key).maybeSingle();
    state.mySection = sec;
    state.route = 'student';
    return;
  }
  // signed in but no role found — sign out
  await supabase.auth.signOut();
  state.session = null;
  state.route = 'login';
}

async function loadAllSectionsAndStudents(){
  const { data: secs } = await supabase.from('sections').select('*').order('key');
  const { data: stus } = await supabase.from('students').select('*').order('no');
  const sections = {};
  (secs||[]).forEach(s => { sections[s.key] = { ...s, students: [] }; });
  (stus||[]).forEach(s => { if(sections[s.section_key]) sections[s.section_key].students.push(s); });
  state.sections = sections;
}

async function loadRoster(){
  const { data } = await supabase.from('public_roster').select('*');
  state.roster = data || [];
}

  const app = document.getElementById('app');

}

async function bindLogin(){
  document.querySelectorAll('.role-toggle button').forEach(b=>{
    b.onclick = ()=>{ state.loginRole = b.dataset.role; state.loginStep = 'name'; render(); };
  });
  const msg = (html)=>{ const m=document.getElementById('loginMsg'); if(m) m.innerHTML = html; };

  if(state.loginRole === 'student' && state.loginStep === 'name'){
    await loadRoster();
    document.getElementById('btnFindName').onclick = ()=>{
      const name = document.getElementById('stuName').value.trim();
      if(!name){ msg('<div class="alert alert-error">Please enter your complete name.</div>'); return; }
      const found = state.roster.find(r => normName(r.full_name) === normName(name));
      if(!found){ msg('<div class="alert alert-error">Name not found on the class list. Check your spelling (Last Name, First Name M.I.) or ask your teacher.</div>'); return; }
      state.pendingName = found.full_name;
      state.pendingId = found.id;
      state.loginStep = found.claimed ? 'password' : 'create';
      render();
    };
    document.getElementById('stuName').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('btnFindName').click(); });
  }

  if(state.loginRole === 'student' && state.loginStep === 'password'){
    document.getElementById('btnBackName').onclick = ()=>{ state.loginStep='name'; render(); };
    document.getElementById('btnStuLogin').onclick = async ()=>{
      const pass = document.getElementById('stuPass').value;
      if(!pass){ msg('<div class="alert alert-error">Enter your password.</div>'); return; }
      const email = `s-${state.pendingId}@${EMAIL_DOMAIN}`;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
      if(error){ msg('<div class="alert alert-error">Incorrect password. Ask your teacher to reset it if you forgot.</div>'); return; }
      state.session = data.session;
      await resolveRole();
      render();
    };
    document.getElementById('stuPass').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('btnStuLogin').click(); });
  }

  if(state.loginRole === 'student' && state.loginStep === 'create'){
    document.getElementById('btnBackName').onclick = ()=>{ state.loginStep='name'; render(); };
    document.getElementById('btnStuCreate').onclick = async ()=>{
      const p1 = document.getElementById('stuPass1').value;
      const p2 = document.getElementById('stuPass2').value;
      if(p1.length < 6){ msg('<div class="alert alert-error">Password must be at least 6 characters.</div>'); return; }
      if(p1 !== p2){ msg('<div class="alert alert-error">Passwords do not match.</div>'); return; }
      const email = `s-${state.pendingId}@${EMAIL_DOMAIN}`;
      const { data, error } = await supabase.auth.signUp({ email, password: p1 });
      if(error){ msg('<div class="alert alert-error">'+escapeHtml(error.message)+'</div>'); return; }
      if(!data.session){ msg('<div class="alert alert-error">Account created, but sign-in confirmation is required. Ask your admin to turn off "Confirm email" in Supabase Auth settings.</div>'); return; }
      state.session = data.session;
      const { error: claimErr } = await supabase.rpc('claim_student', { p_student_id: state.pendingId });
      if(claimErr){ msg('<div class="alert alert-error">Could not link your account: '+escapeHtml(claimErr.message)+'</div>'); return; }
      await resolveRole();
      render();
    };
  }

  if(state.loginRole === 'admin'){
    document.getElementById('btnAdminLogin').onclick = async ()=>{
      const email = document.getElementById('admEmail').value.trim();
      const pass = document.getElementById('admPass').value;
      if(!email || !pass){ msg('<div class="alert alert-error">Enter your email and password.</div>'); return; }
      const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
      if(error){ msg('<div class="alert alert-error">'+escapeHtml(error.message)+'</div>'); return; }
      state.session = data.session;
      await resolveRole();
      if(state.route !== 'admin'){ msg('<div class="alert alert-error">This account isn\'t registered as an admin yet. Run the admin-grant SQL statement, then sign in again.</div>'); state.route='login'; }
      render();
    };
    document.getElementById('btnShowAdminSignup').onclick = ()=> document.getElementById('adminSignupBox').classList.toggle('hidden');
    document.getElementById('btnAdminSignup').onclick = async ()=>{
      const email = document.getElementById('admEmail').value.trim();
      const pass = document.getElementById('admPass').value;
      if(!email || pass.length < 6){ msg('<div class="alert alert-error">Enter a valid email and a password of at least 6 characters.</div>'); return; }
      const { error } = await supabase.auth.signUp({ email, password: pass });
      if(error){ msg('<div class="alert alert-error">'+escapeHtml(error.message)+'</div>'); return; }
      msg('<div class="alert alert-ok">Account created. Now run the admin-grant SQL statement with this email in Supabase, then sign in above.</div>');
    };
  }
}

function renderAdminShell(){
  const sectionKeys = Object.keys(state.sections);
  const sec = state.sections[state.activeSection];
  return `
  <div class="app-shell">
    ${topbar(state.session.user.email, 'Administrator', 'AD')}
    <div class="tabs">
      ${sectionKeys.map(k => `<button data-sec="${k}" class="${k===state.activeSection?'active':''}">${escapeHtml(state.sections[k].label)}</button>`).join('')}
      <button data-sec="__accounts" class="${state.activeSection==='__accounts'?'active':''}">Accounts</button>
      <button data-sec="__settings" class="${state.activeSection==='__settings'?'active':''}">Settings</button>
    </div>
    <div class="main" id="adminMain">
      ${state.activeSection === '__accounts' ? renderAccountsPanel() : state.activeSection === '__settings' ? renderSettingsPanel() : renderGradebookPanel(sec)}
    </div>
  </div>
  ${changePasswordModal()}
  ${confirmModal()}
  ${addStudentModal()}`;
}

function renderGradebookPanel(sec){
  const q = state.search.trim().toLowerCase();
  const rows = sec.students.map((s, idx) => ({s, idx})).filter(({s}) => !q || s.full_name.toLowerCase().includes(q));
  return `
    <div class="page-head">
      <div><h2>${escapeHtml(sec.label)}</h2><div class="sub">Computer Systems Servicing 3 &middot; 1st Term Remediation &middot; ${sec.students.length} learners</div></div>
      <div class="save-status" id="saveStatus"><span class="dot"></span><span class="txt">Synced to database</span></div>
    </div>
    <div class="panel">
      <div class="panel-head"><div><h3>Highest Possible Score</h3><div class="desc">Adjust if a task's total points changes. Every grade recalculates automatically.</div></div></div>
      <div class="panel-body">
        <div class="hps-grid">
          ${sec.ww_days.map((v,i)=>`<div class="hg"><label>WW Day ${i+1}</label><input type="number" min="0" class="hps-input" data-cat="ww_days" data-i="${i}" value="${v}"></div>`).join('')}
          ${sec.pt_days.map((v,i)=>`<div class="hg"><label>PT Day ${i+1}</label><input type="number" min="0" class="hps-input" data-cat="pt_days" data-i="${i}" value="${v}"></div>`).join('')}
          <div class="hg"><label>Exam</label><input type="number" min="0" class="hps-input" data-cat="ex_hps" value="${sec.ex_hps}"></div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <div><h3>Learner Records</h3><div class="desc">Enter raw scores &mdash; totals, percentages, weighted scores, and the remedial grade update as you type and save straight to the database.</div></div>
        <div class="toolbar">
          <input class="search-input" id="searchBox" placeholder="Search learner name&hellip;" value="${escapeHtml(state.search)}">
          <button class="btn btn-gold btn-sm" id="btnAddStudent" style="width:auto;">+ Add Learner</button>
        </div>
      </div>
      <div class="table-scroll">
        <table class="grades">
          <thead>
            <tr class="grp">
              <th rowspan="2">No.</th><th rowspan="2">Learner Name</th>
              <th colspan="${sec.ww_days.length + 3}">Written Works &mdash; 15%</th>
              <th colspan="${sec.pt_days.length + 3}">Performance Tasks &mdash; 65%</th>
              <th colspan="3">Exam &mdash; 20%</th>
              <th rowspan="2">Initial<br>Grade</th><th rowspan="2">Remedial<br>Grade</th><th rowspan="2">Status</th><th rowspan="2"></th>
            </tr>
            <tr>
              ${sec.ww_days.map((_,i)=>`<th>D${i+1}</th>`).join('')}<th>Total</th><th>PS</th><th>WS</th>
              ${sec.pt_days.map((_,i)=>`<th>D${i+1}</th>`).join('')}<th>Total</th><th>PS</th><th>WS</th>
              <th>Score</th><th>PS</th><th>WS</th>
            </tr>
          </thead>
          <tbody id="gradeRows">${rows.map(({s, idx}) => renderStudentRow(s, idx, sec)).join('')}</tbody>
        </table>
      </div>
      ${rows.length === 0 ? `<div class="empty-state"><div class="es-icon">&#128269;</div>No learners match &ldquo;${escapeHtml(state.search)}&rdquo;.</div>` : ''}
    </div>`;
}

function renderStudentRow(s, idx, hps){
  const c = computeStudent(s, hps);
  const badgeClass = c.status==='M' ? 'badge-m' : c.status==='SP' ? 'badge-sp' : 'badge-ip';
  return `
    <tr data-idx="${idx}" data-id="${s.id}">
      <td>${s.no ?? (idx+1)}</td>
      <td class="name-cell">${escapeHtml(s.full_name)}</td>
      ${s.ww.map((v,i)=>`<td><input class="cell-input" type="number" data-field="ww" data-i="${i}" value="${v}"></td>`).join('')}
      <td class="computed">${round1(c.wwTotal)}</td><td class="computed">${round1(c.wwPS)}</td><td class="computed">${round2(c.wwWS)}</td>
      ${s.pt.map((v,i)=>`<td><input class="cell-input" type="number" data-field="pt" data-i="${i}" value="${v}"></td>`).join('')}
      <td class="computed">${round1(c.ptTotal)}</td><td class="computed">${round1(c.ptPS)}</td><td class="computed">${round2(c.ptWS)}</td>
      <td><input class="cell-input" type="number" data-field="ex" value="${s.ex}"></td>
      <td class="computed">${round1(c.exPS)}</td><td class="computed">${round2(c.exWS)}</td>
      <td class="final">${round2(c.initial)}</td><td class="final">${c.remedial}</td>
      <td><span class="badge ${badgeClass}">${c.status}</span></td>
      <td class="row-actions"><button title="Remove learner" data-remove="${idx}">&times;</button></td>
    </tr>`;
}

function renderAccountsPanel(){
  const claimed = [];
  Object.values(state.sections).forEach(sec => sec.students.forEach(s => { if(s.auth_user_id) claimed.push({s, sec}); }));
  return `
    <div class="page-head"><div><h2>Learner Accounts</h2><div class="sub">Learners create their own password the first time they sign in. Reset an account if a learner forgets theirs.</div></div></div>
    <div class="panel">
      <div class="panel-head"><h3>Administrator</h3></div>
      <div class="panel-body">
        <div class="accounts-list">
          <div class="arow"><div><div class="an">${escapeHtml(state.session.user.email)}</div><div class="as">Full system access</div></div>
            <button class="btn btn-ghost btn-sm" id="btnAdminChangePw">Change password</button></div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Learners with a password (${claimed.length})</h3></div>
      <div class="panel-body" style="padding:0;">
        ${claimed.length === 0 ? `<div class="empty-state"><div class="es-icon">&#128274;</div>No learner has created a password yet.</div>` : `
        <div class="accounts-list">
          ${claimed.map(({s,sec}) => `<div class="arow">
              <div><div class="an">${escapeHtml(s.full_name)}</div><div class="as">${escapeHtml(sec.label)}</div></div>
              <button class="btn btn-ghost btn-sm" data-reset="${s.id}">Reset password</button>
            </div>`).join('')}
        </div>`}
      </div>
    </div>`;
}

function renderSettingsPanel(){
  return `
    <div class="page-head"><div><h2>Settings</h2><div class="sub">Portal-wide options.</div></div></div>
    <div class="panel">
      <div class="panel-head"><h3>About this portal</h3></div>
      <div class="panel-body" style="font-size:13.5px;line-height:1.7;color:var(--ink-soft);">
        <p>Grades and accounts now live in your own Supabase project &mdash; a real Postgres database with row-level security, not this browser tab. Learner names are visible to anyone who opens the sign-in screen (needed so they can find their own record); grades and passwords are not.</p>
        <p>Remedial grades are computed using the school's Adjusted Transmutation Table, matching the source remediation record.</p>
      </div>
    </div>
    ${(BAKED_SUPABASE_URL && BAKED_SUPABASE_ANON_KEY) ? '' : `
    <div class="panel">
      <div class="panel-head"><h3>Disconnect this device</h3><div class="desc">Forget the saved project connection on this browser (useful if you're switching Supabase projects).</div></div>
      <div class="panel-body"><button class="btn btn-ghost btn-sm" id="btnDisconnect">Forget connection</button></div>
    </div>`}`;
}

function confirmModal(){
  return `
  <div class="modal-overlay hidden" id="confirmModal">
    <div class="modal">
      <h3 id="confirmTitle">Are you sure?</h3><p id="confirmBody"></p>
      <div class="modal-actions"><button class="btn btn-ghost btn-sm" id="confirmCancel">Cancel</button><button class="btn btn-danger btn-sm" id="confirmOk">Confirm</button></div>
    </div>
  </div>`;
}
function showConfirm(title, body, onOk){
  const m = document.getElementById('confirmModal');
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmBody').textContent = body;
  m.classList.remove('hidden');
  document.getElementById('confirmCancel').onclick = ()=> m.classList.add('hidden');
  document.getElementById('confirmOk').onclick = ()=>{ m.classList.add('hidden'); onOk(); };
}
function addStudentModal(){
  return `
  <div class="modal-overlay hidden" id="addModal">
    <div class="modal">
      <h3>Add Learner</h3>
      <p>They'll be added to ${escapeHtml((state.sections[state.activeSection]||{}).label || '')} with zero scores. Use the same Last Name, First Name M.I. format as your class list.</p>
      <div class="field"><label>Complete Name</label><input type="text" id="newStuName" placeholder="e.g. DELA CRUZ, JUAN P."></div>
      <div id="addMsg"></div>
      <div class="modal-actions"><button class="btn btn-ghost btn-sm" id="addCancel">Cancel</button><button class="btn btn-primary btn-sm" id="addOk" style="width:auto;">Add Learner</button></div>
    </div>
  </div>`;
}

function bindAdmin(){
  document.getElementById('btnLogout').onclick = doLogout;
  document.querySelectorAll('.tabs button').forEach(b=>{
    b.onclick = ()=>{ state.activeSection = b.dataset.sec; state.search=''; render(); };
  });
  if(state.activeSection === '__accounts'){ bindAccountsPanel(); return; }
  if(state.activeSection === '__settings'){ bindSettingsPanel(); return; }
  bindGradebook();
}

function bindGradebook(){
  document.querySelectorAll('.hps-input').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const sec = state.sections[state.activeSection];
      const cat = inp.dataset.cat;
      const val = Number(inp.value) || 0;
      if(cat === 'ex_hps') sec.ex_hps = val;
      else sec[cat][Number(inp.dataset.i)] = val;
      indicateSaving();
      const patch = cat === 'ex_hps' ? { ex_hps: val } : { [cat]: sec[cat] };
      const { error } = await supabase.from('sections').update(patch).eq('key', sec.key);
      indicateSaved(!error);
      refreshGradeRows();
    });
  });
  const searchBox = document.getElementById('searchBox');
  searchBox.addEventListener('input', ()=>{ state.search = searchBox.value; refreshGradeRows(); });
  bindGradeRowEvents();
  document.getElementById('btnAddStudent').onclick = ()=>{ document.getElementById('addModal').classList.remove('hidden'); document.getElementById('addMsg').innerHTML=''; };
  document.getElementById('addCancel').onclick = ()=> document.getElementById('addModal').classList.add('hidden');
  document.getElementById('addOk').onclick = async ()=>{
    const nameInput = document.getElementById('newStuName');
    const name = nameInput.value.trim();
    const msg = document.getElementById('addMsg');
    if(!name){ msg.innerHTML = '<div class="alert alert-error">Enter a name.</div>'; return; }
    const exists = Object.values(state.sections).some(sec => sec.students.some(s => normName(s.full_name) === normName(name)));
    if(exists){ msg.innerHTML = '<div class="alert alert-error">A learner with this name already exists.</div>'; return; }
    const sec = state.sections[state.activeSection];
    const row = { section_key: sec.key, no: sec.students.length + 1, full_name: name, ww: sec.ww_days.map(()=>0), pt: sec.pt_days.map(()=>0), ex: 0 };
    const { data, error } = await supabase.from('students').insert(row).select().single();
    if(error){ msg.innerHTML = '<div class="alert alert-error">'+escapeHtml(error.message)+'</div>'; return; }
    sec.students.push(data);
    document.getElementById('addModal').classList.add('hidden');
    render();
    toast('Learner added.');
  };
}

function bindGradeRowEvents(){
  const tbody = document.getElementById('gradeRows');
  if(!tbody) return;
  tbody.querySelectorAll('input.cell-input').forEach(inp=>{
    let t;
    inp.addEventListener('input', ()=>{
      const tr = inp.closest('tr');
      const idx = Number(tr.dataset.idx);
      const sec = state.sections[state.activeSection];
      const s = sec.students[idx];
      const field = inp.dataset.field;
      const val = inp.value === '' ? 0 : Number(inp.value);
      if(field === 'ex') s.ex = val; else s[field][Number(inp.dataset.i)] = val;
      updateRowComputedCells(tr, s, sec);
      indicateSaving();
      clearTimeout(t);
      t = setTimeout(async ()=>{
        const { error } = await supabase.from('students').update({ ww: s.ww, pt: s.pt, ex: s.ex }).eq('id', s.id);
        indicateSaved(!error);
      }, 600);
    });
  });
  tbody.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = Number(btn.dataset.remove);
      const sec = state.sections[state.activeSection];
      const s = sec.students[idx];
      showConfirm('Remove learner?', `This removes ${s.full_name} and their saved grades from ${sec.label}. Their login account (if any) will also be removed.`, async ()=>{
        if(s.auth_user_id){ await supabase.rpc('admin_reset_student', { p_student_id: s.id }); }
        await supabase.from('students').delete().eq('id', s.id);
        sec.students.splice(idx,1);
        render();
        toast('Learner removed.');
      });
    });
  });
}

function updateRowComputedCells(tr, s, hps){
  const c = computeStudent(s, hps);
  const cells = tr.querySelectorAll('td.computed');
  const vals = [round1(c.wwTotal), round1(c.wwPS), round2(c.wwWS), round1(c.ptTotal), round1(c.ptPS), round2(c.ptWS), round1(c.exPS), round2(c.exWS)];
  cells.forEach((td,i)=> td.textContent = vals[i]);
  const finals = tr.querySelectorAll('td.final');
  finals[0].textContent = round2(c.initial);
  finals[1].textContent = c.remedial;
  const badge = tr.querySelector('.badge');
  badge.textContent = c.status;
  badge.className = 'badge ' + (c.status==='M'?'badge-m':c.status==='SP'?'badge-sp':'badge-ip');
}

function refreshGradeRows(){
  const main = document.getElementById('adminMain');
  main.innerHTML = renderGradebookPanel(state.sections[state.activeSection]);
  bindGradebook();
}

function indicateSaving(){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  el.classList.add('saving');
  el.querySelector('.txt').textContent = 'Saving to database\u2026';
}
function indicateSaved(ok){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  el.classList.remove('saving');
  el.querySelector('.txt').textContent = ok ? 'Synced to database' : 'Could not save \u2014 check your connection';
}

function bindAccountsPanel(){
  document.getElementById('btnAdminChangePw').onclick = ()=> document.getElementById('pwModal').classList.remove('hidden');
  bindChangePassword();
  document.querySelectorAll('[data-reset]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.reset;
      let name = '';
      Object.values(state.sections).forEach(sec => sec.students.forEach(s => { if(s.id === id) name = s.full_name; }));
      showConfirm('Reset password?', `${name} will need to create a new password the next time they sign in.`, async ()=>{
        const { error } = await supabase.rpc('admin_reset_student', { p_student_id: id });
        if(error){ toast('Could not reset: ' + error.message); return; }
        Object.values(state.sections).forEach(sec => sec.students.forEach(s => { if(s.id === id) s.auth_user_id = null; }));
        render();
        toast('Password reset.');
      });
    });
  });
}
function bindSettingsPanel(){
  const btn = document.getElementById('btnDisconnect');
  if(!btn) return;
  btn.onclick = ()=>{
    showConfirm('Forget this connection?', 'You\'ll need to paste the project URL and anon key again to reconnect on this device.', async ()=>{
      localStorage.removeItem('gnhs_supabase_config');
      await doLogout();
      state.route = 'setup';
      render();
    });
  };
}

boot();
</script>
</body>
</html>
